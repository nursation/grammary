name: grammary

services:
  server:
    build: ./server
    image: grammary-server:latest
    container_name: grammary
    # comes back by itself after a reboot (Docker Desktop must autostart)
    restart: unless-stopped
    ports:
      - '127.0.0.1:${GRAMMARY_PORT:-8917}:8917'
    environment:
      GRAMMARY_MODEL: ${GRAMMARY_MODEL:-claude-haiku-4-5-20251001}
      # the container's own long-lived token (`claude setup-token`), which
      # up.ps1 saves to .env next to this file (gitignored) on its first run.
      # No `:-` default on purpose: without .env a bare `docker compose up`
      # prints a warning instead of silently recreating the container with no
      # credentials.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
    volumes:
      # live code: edit server/src and `docker restart grammary` — no rebuild
      - ./server/src:/app/src:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8917/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
